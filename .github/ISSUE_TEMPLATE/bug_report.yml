name: Hata raporu
description: Kurulum veya çalışma sorunu bildirin (PIN, kart seri no ve T.C. kimlik paylaşmayın)
title: "[Hata] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Önce README'deki **İlk kez kuranlar için** bölümünü uygulayın; önizleme görünmüyorsa Hızlı Bakış uzantısının işaretli olduğunu kontrol edin.
        **Paylaşmayın:** imza PIN'i, kart seri numarası, T.C. kimlik numarası, sertifika/anahtar dosyası, gizli belge içeriği veya tam log.
  - type: input
    id: macos
    attributes:
      label: macOS sürümü
      placeholder: "Örn. macOS 15.3 (Sequoia)"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Mac modeli ve çip
      placeholder: "Örn. MacBook Air M2 / Mac mini M4"
    validations:
      required: true
  - type: input
    id: appver
    attributes:
      label: Uygulama sürümü
      placeholder: "Örn. 2026.10.19 veya Release etiketi"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Sorun nerede?
      options:
        - QuickLook önizleme (Boşluk tuşu)
        - Finder küçük resmi
        - Salt-okunur görüntüleyici
        - Kurulum / etkinleştirme
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Adımlar, beklenen ve gerçek sonuç
      placeholder: "1. ... 2. ... Beklenen: ... Gerçek: ..."
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Hata metni
      description: Tam log yerine ilgili satırları ekleyin; kişisel veri varsa çıkarın.
      render: shell
  - type: checkboxes
    id: confirm
    attributes:
      label: Onay
      options:
        - label: PIN, kart seri numarası, T.C. kimlik numarası, anahtar veya gizli belge içeriği paylaşmadım.
          required: true
        - label: README'deki etkinleştirme adımlarını denedim.
          required: true
